    <script>
      // Runs before the app module: restore prior disk snapshot, then mirror every
      // localStorage mutation to AppData. In ordinary browsers this does nothing.
      (() => {
        const disk = window.englishBlocksDiskSave;
        if (!disk || !window.localStorage) return;
        try {
          const saved = disk.read();
          if (saved && typeof saved === 'object') {
            for (const [key, value] of Object.entries(saved)) {
              if (typeof value === 'string') localStorage.setItem(key, value);
            }
          }
        } catch (err) { console.error('[save] Restore failed', err); }
        const snapshot = () => {
          const data = {};
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key !== null) data[key] = localStorage.getItem(key);
          }
          if (!disk.write(data)) console.error('[save] Disk snapshot failed');
        };
        for (const name of ['setItem', 'removeItem', 'clear']) {
          const original = Storage.prototype[name];
          Storage.prototype[name] = function (...args) {
            const result = original.apply(this, args);
            if (this === localStorage) snapshot();
            return result;
          };
        }
        window.addEventListener('pagehide', snapshot);
      })();
    </script>
